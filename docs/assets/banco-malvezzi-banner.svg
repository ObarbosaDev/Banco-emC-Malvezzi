<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Banco Malvezzi</title>
  <desc id="desc">Banner do simulador bancário modular desenvolvido em C11</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2445"/>
      <stop offset="1" stop-color="#123b67"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#93c5fd" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1110" cy="48" r="210" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1010" cy="338" r="150" fill="#2563eb" opacity="0.12"/>

  <g transform="translate(70 64)" filter="url(#shadow)">
    <rect width="232" height="232" rx="44" fill="#f8fafc"/>
    <rect x="16" y="16" width="200" height="200" rx="34" fill="url(#accent)"/>
    <path d="M54 92 L116 53 L178 92 Z" fill="#f8fafc"/>
    <rect x="53" y="95" width="126" height="13" rx="6.5" fill="#f8fafc"/>
    <rect x="64" y="115" width="17" height="54" rx="4" fill="#dbeafe"/>
    <rect x="96" y="115" width="17" height="54" rx="4" fill="#dbeafe"/>
    <rect x="128" y="115" width="17" height="54" rx="4" fill="#dbeafe"/>
    <rect x="160" y="115" width="8" height="54" rx="4" fill="#dbeafe"/>
    <rect x="51" y="174" width="130" height="12" rx="6" fill="#f8fafc"/>
    <rect x="43" y="191" width="146" height="10" rx="5" fill="#bfdbfe"/>
    <circle cx="174" cy="174" r="35" fill="#071426" stroke="#7dd3fc" stroke-width="4"/>
    <path d="M157 165 L166 174 L157 183" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M171 184 H187" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="355" y="82" fill="#7dd3fc" font-size="16" font-weight="700" letter-spacing="3">SIMULADOR BANCÁRIO EM C</text>
    <text x="350" y="154" fill="#f8fafc" font-size="57" font-weight="800" letter-spacing="-1">Banco Malvezzi</text>
    <text x="354" y="202" fill="#cbd5e1" font-size="22" font-weight="400">Contas, movimentações e persistência local</text>
    <text x="354" y="232" fill="#94a3b8" font-size="18">com arquitetura modular e estado transacional.</text>

    <g transform="translate(352 267)" font-size="15" font-weight="700">
      <rect width="88" height="36" rx="18" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="44" y="23" text-anchor="middle" fill="#bae6fd">C11</text>

      <rect x="103" width="196" height="36" rx="18" fill="#0ea5e9" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.38"/>
      <text x="201" y="23" text-anchor="middle" fill="#dbeafe">Arquitetura modular</text>

      <rect x="314" width="181" height="36" rx="18" fill="#2563eb" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.42"/>
      <text x="404.5" y="23" text-anchor="middle" fill="#dbeafe">Persistência CSV</text>
    </g>
  </g>
</svg>
